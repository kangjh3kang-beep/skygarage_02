name: CI feedback
on:
  workflow_run:
    workflows: [Platform contracts]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: ci-feedback-main
  cancel-in-progress: false
jobs:
  record-software-feedback:
    if: github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always execute trusted main, never a PR checkout or workflow artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Record current main failure or recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-feedback.mjs
