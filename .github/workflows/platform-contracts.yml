name: Platform contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: npm ci
      - run: npm run inventory -- --check
      - run: node --test tests/*.test.mjs
      - name: Synthetic page and SQL-backed UI harness
        run: npm run test:ui
      - name: Governance PostgreSQL 17 gate
        run: |
          set -o pipefail
          npm run test:database | tee /tmp/governance-checks.log
          grep -qx 'DATABASE_CHECKS_PASSED=58' /tmp/governance-checks.log
      - name: Finance PostgreSQL 17 gate
        run: |
          set -o pipefail
          npm run test:finance | tee /tmp/finance-checks.log
          grep -qx 'FINANCE_CHECKS_PASSED=63' /tmp/finance-checks.log
      - name: Own ERP PostgreSQL 17 gate
        run: |
          set -o pipefail
          npm run test:erp | tee /tmp/erp-checks.log
          grep -qx 'ERP_CHECKS_PASSED=66' /tmp/erp-checks.log
      - name: Hosted Auth provisioning PostgreSQL 17 contracts
        run: LIVE_AUTH_NATIVE=1 node --test tests/live-auth-database.test.mjs
      - name: Site membership PostgreSQL 17 lifecycle contracts
        run: MEMBERSHIP_NATIVE=1 node --test tests/membership-database.test.mjs
      - name: Provider server contract types
        run: npx tsc --ignoreConfig --noEmit --strict --target ES2023 --module ESNext --moduleResolution bundler --skipLibCheck supabase/functions/_shared/payment-provider.ts supabase/functions/live-auth-verification/runner.ts
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest skygarage_core/tests skygarage_arch/tests skygarage_diagnostic/tests skygarage_integration/tests -q
      - run: npm run build
      - name: Record verification scope
        run: |
          echo 'Software contract and build checks passed. Hardware commissioning, authenticated browser acceptance, and field SAT are separate gates.' >> "$GITHUB_STEP_SUMMARY"
