name: Platform contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run test:database
      - run: npm run test:finance
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m pytest skygarage_core/tests skygarage_arch/tests skygarage_diagnostic/tests skygarage_integration/tests -q
      - run: npm run build
      - name: Record verification scope
        run: |
          echo 'Software contract and build checks passed. Hardware commissioning, authenticated browser acceptance, and field SAT are separate gates.' >> "$GITHUB_STEP_SUMMARY"
